services:
  - type: web
    name: bfcn-backend
    runtime: node
    region: oregon
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: NEWS_FETCH_INTERVAL_MINUTES
        value: "30"
      - key: NEWS_AUTO_PUBLISH
        value: "false"
      - key: NEWS_DEFAULT_TIMEZONE
        value: "Africa/Lagos"
